name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
          - os: ubuntu-24.04
            platform: linux
          - os: macos-15
            platform: macos

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\build.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests\test_cli.py build\logview.exe
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $expectedVersion = "logview $($env:GITHUB_REF_NAME.Substring(1))"
            $actualVersion = (& build\logview.exe --version).Trim()
            if ($LASTEXITCODE -ne 0 -or $actualVersion -ne $expectedVersion) {
              throw "Tag version $expectedVersion does not match binary version $actualVersion"
            }
          }

      - name: Build and test on macOS and Linux
        if: runner.os != 'Windows'
        run: |
          make clean && make test
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected_version="logview ${GITHUB_REF_NAME#v}"
            actual_version="$(build/logview --version)"
            if [[ "$actual_version" != "$expected_version" ]]; then
              echo "Tag version $expected_version does not match binary version $actual_version" >&2
              exit 1
            fi
          fi

      - name: Package release archive on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python tests\package_release.py build\logview.exe
          --platform windows --output-directory dist

      - name: Package release archive on macOS and Linux
        if: runner.os != 'Windows'
        run: >-
          python3 tests/package_release.py build/logview
          --platform "${{ matrix.platform }}"
          --output-directory dist

      - name: Test release archive packaging
        run: python tests/test_package_release.py

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-package-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Smoke-test release benchmark on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python tests\benchmark_release.py build\logview.exe
          --build-details "GitHub Actions MSVC smoke test"
          --hardware-details "GitHub-hosted Windows runner"
          --storage-details "GitHub-hosted temporary disk; smoke test only"
          --size-bytes 1048576 --runs 1

      - name: Smoke-test release benchmark on macOS and Linux
        if: runner.os != 'Windows'
        run: >-
          python3 tests/benchmark_release.py build/logview
          --build-details "GitHub Actions C compiler smoke test"
          --hardware-details "GitHub-hosted runner"
          --storage-details "GitHub-hosted temporary disk; smoke test only"
          --size-bytes 1048576 --runs 1

  sanitizer:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build and run the CLI suite with sanitizers
        run: >-
          make clean && make
          CFLAGS="-std=c99 -O1 -g -Wall -Wextra -Wpedantic
          -fsanitize=address,undefined -fno-omit-frame-pointer"
          test

  publish-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-and-test
      - sanitizer
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform release archives
        uses: actions/download-artifact@v7
        with:
          pattern: release-package-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt
          release_options=(
            --verify-tag
            --title "GLogViewer $RELEASE_TAG"
            --generate-notes
          )
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            "${release_options[@]}"
