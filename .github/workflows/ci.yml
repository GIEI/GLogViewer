name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\build.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests\test_cli.py build\logview.exe

      - name: Build and test on macOS and Linux
        if: runner.os != 'Windows'
        run: make clean && make test
