name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-build-smoke:
    name: Build and launch GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - ubuntu-24.04
          - macos-15

    steps:
      - name: Check out GLogViewer
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Linux SDL build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libasound2-dev libdbus-1-dev libdrm-dev libegl1-mesa-dev \
            libfribidi-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libibus-1.0-dev libpipewire-0.3-dev libpulse-dev libthai-dev \
            libudev-dev libusb-1.0-0-dev libwayland-dev libx11-dev \
            libxext-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxkbcommon-dev libxrandr-dev libxss-dev libxtst-dev \
            libdecor-0-dev

      - name: Check out SDL3
        if: runner.os == 'Linux'
        uses: actions/checkout@v7
        with:
          repository: libsdl-org/SDL
          ref: release-3.4.18
          path: build/SDL3-source

      - name: Build and install SDL3 on Linux
        if: runner.os == 'Linux'
        run: |
          cmake -S build/SDL3-source -B build/SDL3-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3" \
            -DSDL_INSTALL=ON -DSDL_TEST_LIBRARY=OFF \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build build/SDL3-build --parallel 2
          cmake --install build/SDL3-build
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/sdl3/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/sdl3/lib" >> "$GITHUB_ENV"

      - name: Install SDL3 on macOS
        if: runner.os == 'macOS'
        run: brew install sdl3 pkgconf

      - name: Install SDL3 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force "build" | Out-Null
          $archive = "build\SDL3-devel.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-devel-3.4.18-VC.zip" `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath "build\SDL3-devel"
          $header = Get-ChildItem "build\SDL3-devel" -Filter "SDL.h" -Recurse |
            Where-Object { $_.FullName -match '\\include\\SDL3\\SDL\.h$' } |
            Select-Object -First 1
          if (-not $header) { throw "SDL3 development headers were not found in the archive." }
          $env:SDL3_DIR = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $header.FullName))
          "SDL3_DIR=$env:SDL3_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\build.bat gui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build GUI on macOS and Linux
        if: runner.os != 'Windows'
        run: make gui

      - name: Bundle SDL3 on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/lib
          sdl_runtime="$(brew --prefix sdl3)/lib/libSDL3.dylib"
          cp "$sdl_runtime" build/lib/libSDL3.dylib
          install_name_tool -id @rpath/libSDL3.dylib build/lib/libSDL3.dylib
          sdl_link="$(otool -L build/logview-gui | awk '/libSDL3\.dylib/{print $1; exit}')"
          test -n "$sdl_link"
          install_name_tool -change "$sdl_link" @rpath/libSDL3.dylib build/logview-gui
          install_name_tool -add_rpath @loader_path/lib build/logview-gui

      - name: Package GUI release archive on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python tests\package_release.py --platform windows --gui-only
          --gui-binary build\logview-gui.exe
          --gui-runtime build\SDL3.dll --output-directory dist-gui

      - name: Package GUI release archive on macOS
        if: runner.os == 'macOS'
        run: >-
          python3 tests/package_release.py --platform macos --gui-only
          --gui-binary build/logview-gui
          --gui-runtime build/lib/libSDL3.dylib
          --output-directory dist-gui

      - name: Package GUI release archive on Linux
        if: runner.os == 'Linux'
        run: |
          sdl_runtime="$(find "$RUNNER_TEMP/sdl3" -name 'libSDL3.so.0' -print -quit)"
          test -n "$sdl_runtime"
          python3 tests/package_release.py --platform linux --gui-only \
            --gui-binary build/logview-gui \
            --gui-runtime "$sdl_runtime" \
            --output-directory dist-gui

      - name: Smoke-test packaged GUI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "build\gui-package-test" | Out-Null
          Expand-Archive `
            -Path "dist-gui\logview-gui-windows-x86_64.zip" `
            -DestinationPath "build\gui-package-test" -Force
          python tests\gui_smoke.py build\gui-package-test\logview-gui.exe

      - name: Smoke-test packaged GUI on macOS and Linux
        if: runner.os != 'Windows'
        run: |
          mkdir -p build/gui-package-test
          tar -xzf dist-gui/logview-gui-*.tar.gz -C build/gui-package-test
          python3 tests/gui_smoke.py build/gui-package-test/run-logview-gui.sh

      - name: Upload GUI release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-package-gui-${{ matrix.os }}
          path: dist-gui/*
          if-no-files-found: error
          retention-days: 14

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
          - os: ubuntu-24.04
            platform: linux
          - os: macos-15
            platform: macos

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\build.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests\test_cli.py build\logview.exe
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $expectedVersion = "logview $($env:GITHUB_REF_NAME.Substring(1))"
            $actualVersion = (& build\logview.exe --version).Trim()
            if ($LASTEXITCODE -ne 0 -or $actualVersion -ne $expectedVersion) {
              throw "Tag version $expectedVersion does not match binary version $actualVersion"
            }
          }

      - name: Build and test on macOS and Linux
        if: runner.os != 'Windows'
        run: |
          make clean && make test
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected_version="logview ${GITHUB_REF_NAME#v}"
            actual_version="$(build/logview --version)"
            if [[ "$actual_version" != "$expected_version" ]]; then
              echo "Tag version $expected_version does not match binary version $actual_version" >&2
              exit 1
            fi
          fi

      - name: Package release archive on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python tests\package_release.py build\logview.exe
          --platform windows --output-directory dist

      - name: Package release archive on macOS and Linux
        if: runner.os != 'Windows'
        run: >-
          python3 tests/package_release.py build/logview
          --platform "${{ matrix.platform }}"
          --output-directory dist

      - name: Test release archive packaging
        run: python tests/test_package_release.py

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-package-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Smoke-test release benchmark on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python tests\benchmark_release.py build\logview.exe
          --build-details "GitHub Actions MSVC smoke test"
          --hardware-details "GitHub-hosted Windows runner"
          --storage-details "GitHub-hosted temporary disk; smoke test only"
          --size-bytes 1048576 --runs 1

      - name: Smoke-test release benchmark on macOS and Linux
        if: runner.os != 'Windows'
        run: >-
          python3 tests/benchmark_release.py build/logview
          --build-details "GitHub Actions C compiler smoke test"
          --hardware-details "GitHub-hosted runner"
          --storage-details "GitHub-hosted temporary disk; smoke test only"
          --size-bytes 1048576 --runs 1

  sanitizer:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build and run the CLI suite with sanitizers
        run: >-
          make clean && make
          CFLAGS="-std=c99 -O1 -g -Wall -Wextra -Wpedantic
          -fsanitize=address,undefined -fno-omit-frame-pointer"
          test

  publish-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-and-test
      - gui-build-smoke
      - sanitizer
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download platform release archives
        uses: actions/download-artifact@v7
        with:
          pattern: release-package-*
          path: release-assets
          merge-multiple: true

      - name: Create release checksums
        run: sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_options=(
            --verify-tag
            --title "GLogViewer $RELEASE_TAG"
            --generate-notes
          )
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            "${release_options[@]}"
